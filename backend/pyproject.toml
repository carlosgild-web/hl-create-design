[project]
name = "hl-create-design-backend"
version = "1.0.0"
description = "Create Design backend: KiCad project generator with an AI guide (FastAPI)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "kicad: needs kicad-cli; runs only in the KiCad container CI job",
]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
skip_covered = true
