# Every push and PR: lint and test both Python services and the frontend.
# No Ollama, API key or KiCad needed (the LLM is the scripted FakeClient).
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the jobs only read the code.
permissions:
  contents: read

jobs:
  python:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, sap-mock]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            ${{ matrix.service }}/requirements.txt
            ${{ matrix.service }}/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: pytest with coverage
        run: |
          pytest -q --cov --cov-report=term --cov-report=markdown:coverage.md
          { echo "## ${{ matrix.service }} coverage"; echo; cat coverage.md; } >> "$GITHUB_STEP_SUMMARY"

  agent-eval:
    name: agent eval (fake model)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Scenario suite on the scripted model
        run: |
          python -m app.cli agent-eval --fake --markdown eval.md
          { echo "## Agent eval (fake)"; echo; cat eval.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Scenario suite on the demo assistant (rules; 2 known limits, decision 0025)
        run: |
          python -m app.cli agent-eval --provider demo --allow-failures --markdown demo.md
          { echo "## Agent eval (demo assistant)"; echo; cat demo.md; } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: e2e (browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - run: pip install -r backend/requirements.txt -r sap-mock/requirements.txt
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm ci --no-audit --no-fund
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: e2e/test-results

  kicad-image:
    name: docker image + KiCad export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the app image (official KiCad base)
        run: docker build -t create-design .
      - name: kicad-cli export tests inside the image
        run: |
          docker run --rm --user root --entrypoint sh create-design -c \
            "pip install -q -r requirements-dev.txt && pytest -q -m kicad"
      - name: Generate a design and export the PDF
        run: |
          mkdir -p out && chmod 777 out
          docker run --rm -e DESIGNS_ROOT=/out -e DATA_DIR=/out/data -v "$PWD/out:/out" \
            create-design python -m app.cli create-design --dept HW --number HL-HW-26-0042 \
            --rev A --name "Bead Drill Controller" --designer "C. Velazquez" \
            --material 000000000040001236 --project P-26-0108 --date 2026-11-17
          test -s out/HW/HL-HW-26-0042/A/output/HL-HW-26-0042_A.pdf
          cp out/HW/HL-HW-26-0042/A/output/HL-HW-26-0042_A.pdf after.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: after-pdf
          path: after.pdf
