[project]
name = "hl-sap-mock"
version = "0.1.0"
description = "Mock SAP PLM service shaped like an SAP Gateway OData v2 API (demo only)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
skip_covered = true
